name: Reference Implementation Verification

on:
  push:
    branches:
      - main
      - agent/clarify-creation-institution-completion
  pull_request:

jobs:
  reference-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run reference tests
        run: npm test

      - name: TypeScript build
        run: npm run build
